{% extends "templates/app.html" %}
{% block head %}
<style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #auto-time {
        flex: 0 0 15px;
        width: 100%;
        margin: 5px 0 0;
        text-align: center;
        font-weight: bold;
    }
    #log {
        flex: 1;
        min-height: 0;
        width: min(calc(100% - 20px), 1100px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 15px;
        padding: 10px;
        border: solid 2px hsl(var(--custom-hue, 151), 20%, 99%);
        border-radius: 20px;
        background: hsla(0, 0%, 20%, 0.5);
    }
    #entries {
        flex: 1;
        overflow-y: auto;
        padding: .6em;
        scrollbar-color: rgba(255,255,255,.3) transparent;
    }
    .entry {
        box-sizing: border-box;
        width: 100%;
        padding: .25em;
        background-color: rgba(128, 128, 128, .2);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.35;
    }
    .entry:nth-child(even) { background-color: transparent; }
    .entry.own-line { background-color: hsla(var(--custom-hue, 151), 75%, 45%, .22); }
    .player { color: #d5a6ff; }
    .player.own { color: hsl(var(--custom-hue, 151), 100%, 72%); font-weight: 700; }
    .progression { color: #42d66b; }
    .useful { color: #4ca8ff; }
    .filler { color: #ddd; }
    .trap { color: #ff5c5c; }
    .location { color: #f4d35e; }
    .status { color: rgba(255,255,255,.65); font-style: italic; }
    .error { color: #ff7777; }
    .entry.deathlink { color: #ff3535; font-weight: 700; }
</style>
{% endblock %}
{% block content %}
<p id="auto-time"></p>
<main id="log" aria-label="Archipelago event log">
    <div id="entries" aria-live="polite">
        {% for line in initial %}
        <div class="entry {{ line.kind }}">{% if line.parts %}{% for part in line.parts %}<span class="{{ part.class }}">{{ part.text }}</span>{% endfor %}{% else %}{{ line.text }}{% endif %}</div>
        {% endfor %}
    </div>
</main>
{% endblock %}
{% block script %}
<script>
    var entries = document.getElementById("entries");
    function appendLine(line) {
        var row = document.createElement("div");
        row.className = "entry " + (line.kind || "info");
        if (line.parts && line.parts.length) {
            for (var i = 0; i < line.parts.length; i++) {
                var span = document.createElement("span");
                span.className = line.parts[i].class || "plain";
                span.textContent = line.parts[i].text || "";
                row.appendChild(span);
            }
        } else {
            row.textContent = line.text || "";
        }
        entries.appendChild(row);
        while (entries.children.length > 500) entries.removeChild(entries.firstChild);
        entries.scrollTop = entries.scrollHeight;
    }
    entries.scrollTop = entries.scrollHeight;
    on("line", appendLine);
    on("reload", function () { window.location.reload(); });
</script>
{% endblock %}
